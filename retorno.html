<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retorno do login · Radar Bruna</title>
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:42rem;margin:2rem auto;padding:0 1rem;color:#2d3142}h1{font-size:1.5rem}code{background:#eee;padding:.1rem .3rem;border-radius:4px}#codigo{display:block;padding:1rem;background:#f5f5f5;border:1px solid #ccc;word-break:break-all}</style>
</head><body><main>
<h1>Conexão com o TikTok</h1>
<p id="msg">Aguardando o retorno do TikTok…</p>
<code id="codigo" hidden></code>
<p id="dica" hidden>Copie o código acima e cole no painel do Radar Bruna, no computador. Depois pode fechar esta página. Não compartilhe este código com ninguém.</p>
<script>
const p=new URLSearchParams(location.search);const c=p.get('code'),e=p.get('error');
if(c){msg.textContent='Autorização recebida. Seu código:';codigo.hidden=false;codigo.textContent=c;dica.hidden=false}
else if(e){msg.textContent='O TikTok não autorizou a conexão ('+e+'). Pode fechar esta página e tentar de novo.'}
else{msg.textContent='Nenhum código recebido. Esta página só é usada ao final do login no TikTok.'}
</script>
</main></body></html>
